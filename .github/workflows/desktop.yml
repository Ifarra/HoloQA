name: Windows desktop
on:
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", "src/holoqa/desktop*.py", "tests/test_desktop*.py", "pyproject.toml", "uv.lock", ".github/workflows/desktop.yml"]
  push:
    branches: ["codex/windows-desktop-foundation"]
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Python dependencies
        run: uv sync --dev --group desktop --locked
      - name: Engine and protocol regression tests
        run: uv run pytest -q
      - name: Frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build bundled engine
        run: uv run python desktop/scripts/build_engine.py
      - name: Packaged engine smoke
        run: uv run python desktop/scripts/smoke_engine.py desktop/src-tauri/binaries/holoqa-desktop-engine-x86_64-pc-windows-msvc.exe
      - name: Build Windows installer
        working-directory: desktop
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: holoqa-windows-x64-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
