[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holoqa"
version = "0.1.0"
description = "MCP-first, self-hosted SIT/UAT tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "websockets>=13.0",
  "openpyxl>=3.1.0",
  "python-multipart>=0.0.9",
  "boto3>=1.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
holoqa-mcp = "holoqa.mcp_server:main"
holoqa-dashboard = "holoqa.dashboard:main"
holoqa-demo = "holoqa.demo_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
