[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holoqa"
version = "2.0.0"
description = "Agentic QA execution framework: a local MCP referee that turns a checked-in test plan into an evidence-backed release checklist the agent cannot pass"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
  "openpyxl>=3.1.0",
  "textual>=6.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
holoqa = "holoqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
holoqa = ["assets/demo/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
